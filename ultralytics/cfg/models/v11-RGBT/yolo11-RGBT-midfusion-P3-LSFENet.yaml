# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # LSFENet-nano
  s: [0.50, 0.50, 1024] # 
  m: [0.50, 1.00, 512] #  LSFENet
  l: [1.00, 1.00, 512] # 
  x: [1.00, 1.50, 512] # 

ch: 6
# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]  # 0-P1/2
  # visible
  - [0, 1, SilenceChannel, [0,3]]  # 1-P1/2
  - [-1, 1, Conv, [64, 3, 2]] # 2-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] #6
  # infrared
  - [ 0, 1, SilenceChannel, [ 3,6 ] ]  # 7-P1/2
  - [ -1, 1, Conv, [ 64, 3, 2 ] ] # 8-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 9-P2/4
  - [ -1, 2, C3k2, [ 256, False, 0.25 ] ]  # 10
  - [-1, 1, Conv, [256, 3, 2]] # 11-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  #12
  # IFSF module
  - [[6, 12], 1, Concat, [1]]  # cat backbone P2  13
  - [-1, 1, IFSF,[]]
  #
  - [-1, 1, Conv, [512, 1, 1]] # 15-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 16-P4/16
  - [-1, 2, C3k2, [512, True]] # 17
  - [-1, 1, Conv, [1024, 3, 2]] # 18-P5/32
  - [-1, 2, C3k2, [1024, True]] # 19
  - [ -1, 1, SPPF, [ 1024, 5 ] ] # 20
  - [ -1, 2, C2PSA, [ 1024 ] ] # 21

# YOLO11n head
head:
  # SFFE module
  - [-1, 1, DySample, []]
  - [[-1, 17], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 24
  - [-1, 1, SFFE_Suppress, []]
  #
  # SFFE module
  - [-1, 1, DySample, []]
  - [[-1, 15], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 28(P3/8-small)
  - [-1, 1, SFFE_Suppress, []]
  #
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 25], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 32 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 21], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 35 (P5/32-large)

  - [[29, 32, 35], 1, Detect, [nc]] # Detect(P3, P4, P5)
